<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水引日貨｜mizubiki_japan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EE;
    --ink: #2B2420;
    --vermillion: #7A1F2B;
    --gold: #B8902E;
    --pink: #E9C6C4;
    --line: rgba(43,36,32,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(122,31,43,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(184,144,46,0.06), transparent 45%);
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 48px 32px 40px;
    position: relative;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 42px;
    letter-spacing: 0.08em;
    margin: 0;
    line-height: 1.3;
    color: var(--ink);
  }

  h1 .en {
    display: block;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.22em;
    color: rgba(43,36,32,0.55);
    margin-top: 10px;
    text-transform: lowercase;
  }

  /* central hero artwork */
  .hero-img {
    width: 78%;
    max-width: 260px;
    margin: 24px auto 30px;
    display: block;
    border-radius: 16px;
    box-shadow: 0 14px 34px rgba(122,31,43,0.18);
  }

  .tagline {
    font-size: 15px;
    line-height: 2;
    color: rgba(43,36,32,0.75);
    margin: 0 0 34px;
    letter-spacing: 0.04em;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    background: var(--vermillion);
    color: var(--cream);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 0.12em;
    font-weight: 500;
    border-radius: 999px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    box-shadow: 0 6px 18px rgba(122,31,43,0.22);
  }

  .cta:hover {
    background: #611720;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(122,31,43,0.3);
  }

  .cta:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }

  .cta svg { flex-shrink: 0; }

  .handle {
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: rgba(43,36,32,0.45);
  }

  @media (prefers-reduced-motion: no-preference) {
    .hero-img {
      animation: fadeIn 0.9s ease forwards 0.15s;
      opacity: 0;
    }
    .card {
      animation: rise 0.7s ease forwards;
      opacity: 0;
      transform: translateY(10px);
    }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  footer {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(43,36,32,0.35);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">日本長住・認真代購</div>
    <h1>水引日貨<span class="en">mizubiki japan</span></h1>

    <img class="hero-img" src="mizubiki-hero.jpeg" alt="水引 mizubiki 傳統繩結圖樣">


    <p class="tagline">保障正品優質<br>細緻包裝・讓您的自用與贈禮更具格調</p>

    <a class="cta" href="https://www.instagram.com/mizubiki_japan/" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor"/>
      </svg>
      前往 Instagram
    </a>
    <div class="handle">@mizubiki_japan</div>
  </div>
  <footer>水引日貨 © mizubiki_japan</footer>
</body>
</html>
