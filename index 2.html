<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水引日貨｜LINE 聯絡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3EE;
    --ink: #2B2420;
    --gold: #B8902E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 20px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(6,199,85,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(184,144,46,0.06), transparent 45%);
  }
  .card {
    width: 100%; max-width: 420px; text-align: center;
    padding: 48px 32px 40px;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.28em; color: var(--gold);
    font-weight: 500; margin-bottom: 18px; text-transform: uppercase;
  }
  h1 {
    font-family: 'Shippori Mincho', serif; font-weight: 700;
    font-size: 34px; letter-spacing: 0.08em; margin: 0 0 34px;
    line-height: 1.4; color: var(--ink);
  }
  .hero-img {
    width: 70%;
    max-width: 220px;
    margin: 0 auto 30px;
    display: block;
    border-radius: 16px;
    box-shadow: 0 14px 34px rgba(6,199,85,0.15);
  }
  .cta-group {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 36px; background: #06C755; color: var(--cream);
    text-decoration: none; font-size: 15px; letter-spacing: 0.12em;
    font-weight: 500; border-radius: 999px; width: 100%; max-width: 280px;
    justify-content: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    box-shadow: 0 6px 18px rgba(6,199,85,0.25);
  }
  .cta:hover { background: #05a648; transform: translateY(-2px); }
  .cta svg { flex-shrink: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">日本長住・認真代購</div>
    <h1>水引日貨<br>LINE 聯絡方式</h1>
    <img class="hero-img" src="mizubiki-hero.jpeg" alt="水引 mizubiki 傳統繩結圖樣">
    <div class="cta-group">
      <a class="cta" href="https://line.me/ti/p/~kangchinwei" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 5.7 2 10.2c0 3.98 3.44 7.32 8.09 7.97.32.07.75.21.86.49.1.25.06.65.03.9l-.14.86c-.04.25-.2.99.86.54 1.06-.45 5.68-3.34 7.75-5.73C20.9 13.6 22 12 22 10.2 22 5.7 17.52 2 12 2z"/>
        </svg>
        加我 LINE 好友
      </a>
      <a class="cta" href="https://line.me/ti/g2/Gj9ISyyMlH7ZfESkPGay4IG_r_0eexuZuUWhSw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 5.7 2 10.2c0 3.98 3.44 7.32 8.09 7.97.32.07.75.21.86.49.1.25.06.65.03.9l-.14.86c-.04.25-.2.99.86.54 1.06-.45 5.68-3.34 7.75-5.73C20.9 13.6 22 12 22 10.2 22 5.7 17.52 2 12 2z"/>
        </svg>
        加入 LINE 社群
      </a>
    </div>
  </div>
</body>
</html>
